<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a878"/>
      <stop offset="100%" stop-color="#8a6840"/>
    </linearGradient>
  </defs>
  <!-- main ridge beam -->
  <rect x="8" y="6" width="384" height="14" rx="3" fill="url(#beam)" stroke="#3d2e1f" stroke-width="2"/>
  <rect x="10" y="8" width="380" height="4" rx="1" fill="#e8d4b0" opacity="0.45"/>
  <!-- cross beams -->
  <g fill="url(#beam)" stroke="#3d2e1f" stroke-width="1.8">
    <rect x="40" y="22" width="10" height="50" rx="2"/>
    <rect x="130" y="22" width="10" height="50" rx="2"/>
    <rect x="220" y="22" width="10" height="50" rx="2"/>
    <rect x="310" y="22" width="10" height="50" rx="2"/>
  </g>
  <!-- soft shadow under ridge -->
  <rect x="8" y="20" width="384" height="6" fill="#3d2e1f" opacity="0.12"/>
</svg>
